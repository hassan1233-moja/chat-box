<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Real-time Chat App with Mentions</title>
        <link rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <style>
        body { font-family: Arial, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .container { width: 100%; max-width: 400px; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .hidden { display: none !important; }
        input, button { width: 100%; padding: 10px; margin-top: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { background: #007bff; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background: #0056b3; }
        .switch-text { text-align: center; margin-top: 15px; cursor: pointer; color: #007bff; font-size: 14px; }
        
        /* চ্যাট ও সাইডবার লেআউট */
        #chat-layout { display: flex; width: 750px; height: 520px; background: rgba(249, 246, 169, 0.621); border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); overflow: hidden; }
        #sidebar { width: 220px; background: #fbf16f; color: rgb(7, 7, 7); padding: 15px; overflow-y: auto; }
        #sidebar h3 { font-size: 16px; margin-top: 0; border-bottom: 1px solid #fae98b; padding-bottom: 8px; }
        #user-list { list-style: none; padding: 0; margin: 0; }
        #user-list li { padding: 6px 10px; margin-bottom: 5px; background: #f7d344; border-radius: 4px; cursor: pointer; font-size: 14px; transition: 0.2s; }
        #user-list li:hover { background: #1abc9c; }
        
        .chat-main { flex-grow: 1; display: flex; flex-direction: column; padding: 15px; }
        #chat-box { flex-grow: 1; min-height: 0; border: 3px solid #f59536; border-radius: 5px; overflow-y: auto; padding: 10px; margin-bottom: 15px; background: #fafafa; }
        
        .message { margin-bottom: 10px; padding: 8px 12px; border-radius: 4px; background: #e1ffc7; word-break: break-word; }
        /* কেউ ট্যাগ করলে মেসেজের ডিজাইন হাইলাইট হবে */
        .message.mentioned { background: #ffeeba; border-left: 4px solid #ffc107; }
        
        #form { display: flex; gap: 10px; }
        #input { flex-grow: 1; margin-top: 0; }

        /* মোবাইল ভিউতে সাইডবার হাইড এবং 3-line মেনু বাটন */
/* ডেস্কটপে মেনু বাটন ও ওভারলে লুকানো থাকবে */
        #menu-btn {
           display: none;
           position: fixed;
           top: 15px;
           left: 15px;
           z-index: 1001;
           background: #2c3e50;
           color: white;
           border: none;
           padding: 8px 12px;
           border-radius: 5px;
           font-size: 18px;
           cursor: pointer;
        }

        #overlay {
           display: none;
           position: fixed;
           top: 0;
           left: 0;
           width: 100%;
           height: 100%;
           background: rgba(0, 0, 0, 0.5);
           z-index: 999;
        }

        @media (max-width: 768px) {
    /* ১. মেনু বাটনকে ওপরের ফুল-উইডথ থেকে সরিয়ে বাম পাশে ফিক্স করা */
        #menu-btn {
          display: flex !important;
          align-items: center;
          justify-content: center;
          position: fixed !important;
          top: 0;
          left: 0;
          width: 30px !important; /* চিকন করে বাম পাশে থাকবে */
          height: 89.5vh !important; /* সবুজ মার্কের মতো পুরো বাম পাশ জুড়ে থাকবে */
          background-color: (1, 1, 1, 0.621);
          color: rgb(245, 244, 170);
          border: none;
          border-radius: 0px;
          padding: 15px 0;
          z-index: 998;
          cursor: pointer;
          align-items: flex-start; /* আইকনটি একদম ওপরে বাম কোণায় রাখবে */
        }
        /* ৩. সাইডবার বাম দিক থেকে ডান দিকে ওপেন হওয়া */
        #sidebar {
          position: fixed !important;
          top: 0;
          left: 0;
          width: 260px !important;
          height: 100vh !important;
          z-index: 1000;
          transform: translateX(-100%); /* শুরুতে বাম দিকে লুকানো থাকবে */
          transition: transform 0.3s ease;
        }

    /* ক্লিক করলে বাম থেকে ডানে স্লাইড হয়ে আসবে */
        #sidebar.active {
          transform: translateX(0);
        }

        #overlay.active {
          display: block !important;
        }
    } 


    </style>
    </head>
    <body>

        <!-- ১. অথেন্টিকেশন (লগইন / রেজিস্ট্রেশন) সেকশন -->
        <div id="auth-container" class="container">
            <h2 id="form-title" style="text-align: center;">Login 🔑</h2>

            <form id="auth-form">
                <input type="text" id="username" placeholder="Username"
                    class="hidden" />
                <input type="email" id="email" placeholder="Email Address"
                    required />
                <input type="password" id="password" placeholder="Password"
                    required />
                <button type="submit" id="auth-btn">Login</button>
            </form>

            <div class="switch-text" id="switch-btn">you have no account? Sign
                up
                here</div>
            <div id="error-msg"
                style="color: red; text-align: center; margin-top: 10px; font-size: 14px;"></div>
        </div>

        <!-- ২. মূল চ্যাট রুম ও সাইডবার সেকশন (লগইন করার পর দেখাবে) -->
        <div id="chat-layout" class="hidden">

            <!-- মোবাইলে দেখানোর জন্য 3-line মেনু বাটন -->
            <button id="menu-btn" type="button">
                <i class="fa-solid fa-bars"></i>
            </button>

            <!-- সাইডবার খোলা থাকলে পেছনের স্ক্রিন ডার্ক করার জন্য Overlay -->
            <div id="overlay"></div>

            <!-- অনলাইন ইউজারদের সাইডবার (আপনার আগের কোড) -->
            <div id="sidebar">
                <div
                    style="display: flex; justify-content: space-between; align-items: center;">
                    <h3 style="margin: 0;">🟢 Online members (<span
                            id="online-count">0</span>)</h3>
                    <!-- মোবাইলে সাইডবার বন্ধ করার ক্রস (×) বাটন -->
                    <span id="close-sidebar"
                        style="display: none; cursor: pointer; font-size: 22px;">&times;</span>
                </div>

                <ul id="user-list"></ul>

                <div style="font-size: 11px; color: #a5b1c2; margin-top: 15px;">
                    💡 click a username for tag.
                </div>
            </div>

            <!-- আপনার চ্যাট মেসেজ ও ফর্মের বাকি কোড এখানে থাকবে -->

            <!-- চ্যাট উইন্ডো -->
            <div class="chat-main">
                <div
                    style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                    <h3 style="margin: 0;">Cha<span
                            style="color:#ffc107; gap: 0px;">tex</span></h3>

                    <span style="font-size: 13px; color: #b479f3;">User: <b
                            id="user-display"></b></span>
                </div>

                <div id="chat-box"></div>
                <form id="form"
                    style="display: flex; gap: 10px; align-items: flex-start; margin: 0;">
                    <textarea id="input" autocomplete="off"
                        placeholder="Type a message or click user to tag..."
                        required
                        rows="1"
                        style="flex: 1; height: 42px; padding: 0 15px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; outline: none; box-sizing: border-box; margin: 0;"></textarea>

                    <button type="submit"
                        style="width: 45px; height: 42px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-sizing: border-box; padding: 0; margin: 0;">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </form>
            </div>
        </div>

        <!-- Socket.io ক্লায়েন্ট স্ক্রিপ্ট -->
        <script src="/socket.io/socket.io.js"></script>
        <script>
        const authContainer = document.getElementById('auth-container');
        const chatLayout = document.getElementById('chat-layout');
        const authForm = document.getElementById('auth-form');
        const authBtn = document.getElementById('auth-btn');
        const formTitle = document.getElementById('form-title');
        const usernameInput = document.getElementById('username');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const switchBtn = document.getElementById('switch-btn');
        const errorMsg = document.getElementById('error-msg');
        const userDisplay = document.getElementById('user-display');


        //3 line menu const log 
        const menuBtn = document.getElementById('menu-btn');
        const closeBtn = document.getElementById('close-sidebar');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');





        let isLoginMode = true;
        let socket; // গ্লোবাল সকেট ভ্যারিয়েবল যাতে ডুপ্লিকেট কানেকশন তৈরি না হয়

        // লগইন/রেজিস্ট্রেশন সুইচ করার লজিক
        switchBtn.addEventListener('click', () => {
            isLoginMode = !isLoginMode;
            if (isLoginMode) {
                formTitle.textContent = 'Login 🔑';
                authBtn.textContent = 'Login';
                usernameInput.classList.add('hidden');
                switchBtn.textContent = 'Don\'t have an account? Sign up here';
            } else {
                formTitle.textContent = 'Sign Up 📝';
                authBtn.textContent = 'Register';
                usernameInput.classList.remove('hidden');
                switchBtn.textContent = 'Already have an account? Login here';
            }
            errorMsg.textContent = '';
        });

        // ফর্ম সাবমিট হ্যান্ডেলার
        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.textContent = '';

            const endpoint = isLoginMode ? '/api/auth/login' : '/api/auth/register';
            const payload = { email: emailInput.value, password: passwordInput.value };
            if (!isLoginMode) payload.username = usernameInput.value;

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.message || 'Something went wrong!');

                if (isLoginMode) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('username', data.user.username);
                    showChatRoom(data.user.username);
                } else {
                    alert('Registration successful! Please login now.');
                    switchBtn.click();
                }
            } catch (err) {
                errorMsg.textContent = err.message;
            }
        });

        // চ্যাট রুম দেখানোর ফাংশন
        function showChatRoom(username) {
            authContainer.classList.add('hidden');
            chatLayout.classList.remove('hidden');
            userDisplay.textContent = username;
            
            // সকেট একবারই ইনিশিয়ালাইজ করা
            if (!socket) {
                socket = io();
            }

            initSocketChat(username);
        }

        // Socket.io চ্যাট ও ট্যাগিং লজিক
        function initSocketChat(username) {
            const form = document.getElementById('form');
            const input = document.getElementById('input');
            const chatBox = document.getElementById('chat-box');
            const userList = document.getElementById('user-list');
            const onlineCount = document.getElementById('online-count');

            // সকেট সফলভাবে কানেক্ট হওয়ার পরই কেবল সার্ভারে নাম পাঠানো হবে
            socket.on('connect', () => {
                console.log('🟢 Socket Connected, emitting join_user for:', username);
                socket.emit('join_user', username);
                socket.emit('load_old_messages');
            });

            // যদি সকেট ইতিমধ্যে কানেক্টেড থাকে
            if (socket.connected) {
                socket.emit('join_user', username);
                socket.emit('load_old_messages');
            }


           //3 line menu humburger button click event
            function toggleSidebar() {
               sidebar.classList.toggle('active');
               overlay.classList.toggle('active');
}

            menuBtn.addEventListener('click', toggleSidebar);
            closeBtn.addEventListener('click', toggleSidebar);
            overlay.addEventListener('click', toggleSidebar);






            // পুরোনো ইভেন্টের ডুপ্লিকেট লিসেনার এড়াতে
            socket.off('update_user_list');
            socket.off('load_old_messages');
            socket.off('chat message');

            // অনলাইন ইউজার লিস্ট আপডেট হলে তা রেন্ডার করা
            socket.on('update_user_list', (users) => {
                console.log('📥 Server থেকে পাওয়া user list:', users);
                
                userList.innerHTML = '';
                onlineCount.textContent = users.length;

                users.forEach((user) => {
                    const li = document.createElement('li');
                    li.textContent = user;
                    li.addEventListener('click', () => {
                        input.value = `@${user} ` + input.value;
                        input.focus();
                    });
                    userList.appendChild(li);
                });
            });

            // ডাটাবেস থেকে পুরোনো মেসেজগুলো লোড করে দেখানো
            socket.on('load_old_messages', (messages) => {
                chatBox.innerHTML = ''; 
                messages.forEach((msg) => {
                    const item = document.createElement('div');
                    item.classList.add('message');
                    if (msg.message.includes(`@${username}`)) {
                        item.classList.add('mentioned');
                    }
                    item.innerHTML = `<b>${msg.sender}:</b> ${msg.message}`;
                    chatBox.appendChild(item);
                });
                chatBox.scrollTop = chatBox.scrollHeight;
            });

            // মেসেজ পাঠানো
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                console.log('Send button clicked! Input value:', input.value);
                
                if (input.value.trim() !== '') {
                    const messageData = {
                        sender: username,
                        text: input.value
                    };
                    console.log('Emitting chat message:', messageData);
                    socket.emit('chat message', messageData);
                    input.value = '';
                }
            });

            // নতুন রিয়েল-টাইম মেসেজ রিসিভ করা
            socket.on('chat message', (data) => {
                console.log('📥 Server theke paowa chat message:', data); // এটি কনসোলে প্রিন্ট হবে
                
                const item = document.createElement('div');
                item.classList.add('message');
                
                if (data.text && data.text.includes(`@${username}`)) {
                    item.classList.add('mentioned');
                }

                item.innerHTML = `<b>${data.sender}:</b> ${data.text}`;
                chatBox.appendChild(item);
                chatBox.scrollTop = chatBox.scrollHeight;
            });

        }

        // পেজ রিফ্রেশ হলে আগের লগইন স্টেট ধরে রাখা
        window.onload = () => {
            const savedUsername = localStorage.getItem('username');
            if (savedUsername) {
                showChatRoom(savedUsername);
            }
        };
    </script>
    </body>
</html>
